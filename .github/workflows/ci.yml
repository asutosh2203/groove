name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Checks (pinned Arch container)
    runs-on: ubuntu-24.04
    # Everything runs in one pinned Arch Linux environment (D-36): the image tag fixes the base system and the
    # Arch Linux Archive snapshot below fixes every package (Qt 6.12, Plasma 6.8). To bump, change BOTH to the same
    # date: a new tag from https://hub.docker.com/r/archlinux/archlinux/tags (base-YYYYMMDD.0.N) and ALA_DATE.
    # Dependabot does not update either.
    container:
      image: archlinux/archlinux:base-20261110.0.623834
    env:
      ALA_DATE: 2026/11/10
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    defaults:
      run:
        # bash with pipefail, so a failing command in a pipeline (qmltestrunner | tee) fails the step.
        shell: bash
    steps:
      - name: Install pinned packages
        run: |
          echo "Server = https://archive.archlinux.org/repos/$ALA_DATE/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          # The archive can be slow on large files; pacman resumes partial downloads, so a few retries are cheap.
          for attempt in 1 2 3 4; do
            if pacman -Syyuu --noconfirm --noprogressbar --needed --disable-download-timeout \
                 qt6-declarative kirigami libplasma plasma-workspace plasma5support plasma-nm plasma-pa powerdevil kcmutils \
                 nodejs python zip unzip git; then
              break
            fi
            [ "$attempt" -lt 4 ] || { echo "::error::pacman failed after $attempt attempts"; exit 1; }
            echo "pacman attempt $attempt failed, retrying in 20 s"
            sleep 20
          done
          # Arch keeps the Qt tools (qmllint, qmltestrunner) out of PATH.
          echo /usr/lib/qt6/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v7

      - name: Show tool versions
        run: |
          echo "node $(node --version)"
          qmllint --version
          pacman -Q qt6-declarative plasma-workspace kirigami nodejs

      - name: Run Node tests
        run: node --test tests/*.test.cjs

      - name: Lint all QML and JavaScript (errors fatal, warnings ratcheted)
        run: scripts/check-qml.sh

      - name: Run Qt Quick tests
        run: |
          qmltestrunner -input tests 2>&1 | tee qmltest.log
          grep '^Totals:' qmltest.log

      - name: Build and validate package
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh
          unzip -t dynamic-island-*.plasmoid

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate release version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%-alpha}"
          metadata_version="$(python3 -c 'import json; print(json.load(open("metadata.json"))["KPlugin"]["Version"])')"
          if [ "$base_version" != "$metadata_version" ]; then
              echo "Tag version $base_version does not match metadata.json version $metadata_version" >&2
              exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          if [[ "$tag_version" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package plasmoid
        run: |
          chmod +x scripts/package.sh
          scripts/package.sh "${{ steps.version.outputs.version }}"
          unzip -t dynamic-island-*.plasmoid

      - name: Show artifact
        run: ls -la *.plasmoid

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dynamic-island-*.plasmoid
          fail_on_unmatched_files: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
